name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger directly from GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. Continuous Integration (CI)
  # ==========================================
  ci:
    name: "Continuous Integration (Lint, Test, Build)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Code Linting (ESLint)
        run: npm run lint

      - name: 2. Automated Unit Tests (Vitest)
        run: npm run test:run

      - name: 3. Production Build (Vite)
        run: npm run build

      - name: 4. Docker Image Build Verification
        run: docker build -t react-cicd-demo:latest .

      - name: Upload Pages Artifact
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ==========================================
  # 2. Continuous Deployment (CD)
  # ==========================================
  cd:
    name: "Continuous Deployment (GitHub Pages)"
    needs: ci
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
